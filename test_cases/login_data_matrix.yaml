    - action: "verify_selected_text"
      params:
        ctrl: "$username_combobox"
        expected: "{{input_params.username}}"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.password_field.best_match}}"
      save_as: "password_edit"
    
    - action: "input_text"
      params:
        ctrl: "$password_edit"
        text: "{{input_params.password}}"
        allure_attach: true
        allure_name: "输入密码_{{case_id}}"
    
    - action: "click_ctrl"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.login_button_text}}"
      allure_attach: true
      allure_name: "执行登录操作_{{case_id}}"
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 辅助功能按钮测试模板
  auxiliary_buttons_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    # 测试找回密码按钮
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.find_password_button}}"
      save_as: "find_pwd_btn"
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$find_pwd_btn"
        allure_attach: true
        allure_name: "点击找回密码按钮_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 2
      optional: true
    
    - action: "get_window"
      params:
        timeout: 5
        class_name: "*"
      save_as: "new_window"
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
      optional: true
    
    - action: "close_window"
      params:
        target: "$new_window"
      optional: true
    
    # 测试在线注册按钮
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.register_button}}"
      save_as: "register_btn"
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$register_btn"
        allure_attach: true
        allure_name: "点击在线注册按钮_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 2
      optional: true
    
    - action: "get_window"
      params:
        timeout: 5
        class_name: "*"
      save_as: "new_window"
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 密码功能测试模板
  password_function_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.username_field.best_match}}"
      save_as: "account_edit"
    
    - action: "input_text"
      params:
        ctrl: "$account_edit"
        text: "{{input_params.username}}"
        allure_attach: true
        allure_name: "输入用户名_{{case_id}}"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.password_field.best_match}}"
      save_as: "password_edit"
    
    - action: "input_text"
      params:
        ctrl: "$password_edit"
        text: "{{input_params.password}}"
        allure_attach: true
        allure_name: "输入密码_{{case_id}}"
    
    - action: "get_ctrl_property"
      params:
        ctrl: "$password_edit"
        property: "is_password"
      save_as: "is_password_hidden"
    
    # 测试密码显示/隐藏切换
    - action: "by_index"
      params:
        parent: "$password_edit"
        best_match: "Button"
        control_type: "Button"
      save_as: "password_visibility_btn"
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$password_visibility_btn"
        allure_attach: true
        allure_name: "切换密码显示状态_{{case_id}}"
      optional: true
    
    - action: "get_ctrl_property"
      params:
        ctrl: "$password_edit"
        property: "is_password"
      save_as: "is_password_shown"
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 窗口功能测试模板
  window_function_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    # 测试窗口最小化
    - action: "minimize_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "最小化窗口_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 1
      optional: true
    
    - action: "verify_window_state"
      params:
        ctrl: "$login_win"
        state: "minimized"
    
    - action: "restore_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "还原窗口_{{case_id}}"
      optional: true
    
    # 测试窗口最大化
    - action: "maximize_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "最大化窗口_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 1
      optional: true
    
    - action: "verify_window_state"
      params:
        ctrl: "$login_win"
        state: "maximized"
    
    - action: "restore_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "还原窗口_{{case_id}}"
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # UI状态测试模板
  ui_state_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    # 验证初始控件状态
    - action: "check_ctrl_state"
      params:
        parent: "$login_win"
        controls: ["Edit", "Button"]
        allure_attach: true
        allure_name: "验证初始控件状态_{{case_id}}"
    
    # 测试焦点切换
    - action: "test_focus_order"
      params:
        parent: "$login_win"
        controls: ["{{base_config.common.username_field.best_match}}", "{{base_config.common.password_field.best_match}}", "{{base_config.common.login_button_text}}"]
        allure_attach: true
        allure_name: "测试焦点切换_{{case_id}}"
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 错误消息验证专用模板
  error_validation_flow:
    - action: "sleep"
      params:
        seconds: 1
      optional: true
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.message_box_class}}"
      timeout: 5
      save_as: "msg_box"
      optional: true  # 某些错误可能在页面上直接显示
    
    - action: "by_index"
      params:
        parent: "$msg_box"
        best_match: "QLabel"
        control_type: "Text"
      save_as: "msg_label"
      optional: true
    
    - action: "get_text"
      params:
        ctrl: "$msg_label"
      save_as: "actual_error"
      optional: true
    
    - action: "assert"
      params:
        condition: "actual_error in expected_results.error_message.text"
        on_failure: "log_error_and_screenshot"
      optional: true

# 验证规则配置
validation_rules:
  retry_mechanism:
    enabled: true
    max_retries: 2
    retry_delay: 1  # 秒
    
  timeout_config:
    element_wait: 5
    page_load: 10
    script_timeout: 30
    
  screenshot_policy:
    on_failure: true
    on_assertion: true
    path_template: "reports/screenshots/{{case_id}}_{{timestamp}}.png"
    
  cleanup_policy:
    on_success: false
    on_failure: true
    always_cleanup: false