# 登录测试数据矩阵
# 数据矩阵格式：包含测试用例的所有必要参数、预期结果和边界条件
# 支持参数化测试，每个测试场景作为一个独立的测试用例执行

# 基础配置
base_config:
  test_suite: "登录模块测试"
  feature: "登录功能"
  story: "用户认证"
  epic: "登录测试"
  priority: "P0"
  # 公共配置 - 避免重复定义
  common:
    # 应用路径配置 
    exec_path: "D:/Program Files/CBIM/modulelogin.exe" 
    
    # 窗口配置 
    window_class: "LoginDialog"              # 窗口类型为LoginDialog 
    window_title: "modulelogin"              # 窗口标题 
    
    # 登录控件配置 - 基于pywinauto控件树提取 
    username_field: 
      parent: "ComboBox"                      # 用户名在ComboBox内 
      best_match: "Edit0"                     # 第一个Edit控件 
      print_id: "Edit - '75145'"              # 用于日志识别的标识 
    
    password_field: 
      best_match: "Edit2"                     # 第三个Edit控件（密码框） 
      print_id: "Edit - ''"                   # 空标题的Edit控件 
    
    login_button_text: "登 录Button"          # 登录按钮的完整标识 
    login_button_title: "登 录"               # 登录按钮显示文本 
    
    # 附加功能控件（用于扩展测试） 
    remember_password_checkbox: "记住密码"    # 记住密码复选框 
    find_password_button: "找回密码Button"    # 找回密码按钮 
    register_button: "在线注册Button"         # 在线注册按钮 
    
    # 控件路径常量（基于.md文件中的层次结构） 
    parent_group: "GroupBox2"                 # 登录表单所在的GroupBox 
    message_box_class: "QMessageBox"          # 消息弹窗类名（根据预期结果推断）

# 数据矩阵 - 每个条目表示一个测试场景
# 包含输入参数、预期结果和边界条件
data_matrix:
  # ==================== 正向场景 ====================
  - case_id: "LOGIN_001"
    case_name: "正常登录 - 正确用户名和密码"
    description: "验证使用有效的用户名和密码能够成功登录系统"
    severity: "blocker"
    tags: ["login", "smoke", "positive", "critical_path"]
    input_params:
      username: "13165"
      password: "1"
    expected_results:
      window_validation:
        action: "get_window"
        params:
          class_name: "LOGINMainWindow"
        timeout: 10
        should_exist: true
      login_success: true
      status_code: 200
    boundary_conditions:
      category: "valid_credentials"
      data_type: "valid"
      expectation: "success"

  # ==================== 负向场景 - 空值验证 ====================
  - case_id: "LOGIN_002"
    case_name: "登录失败 - 空用户名"
    description: "验证用户名为空时系统能正确提示错误信息"
    severity: "critical"
    tags: ["login", "negative", "empty_validation", "username"]
    input_params:
      username: ""
      password: "1"
    expected_results:
      error_message:
        window:
          action: "get_window"
          params:
            class_name: "QMessageBox"
          timeout: 5
          save_as: "msg_box"
        label:
          action: "by_index"
          params:
            parent: "$msg_box"
            best_match: "QLabel"
          save_as: "msg_label"
        text:
          action: "get_text"
          params:
            ctrl: "$msg_label"
          expected_value: "账户和密码不能为空！"
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "empty_validation"
      data_type: "invalid"
      empty_field: "username"
      expected_behavior: "inline_validation"

  - case_id: "LOGIN_003"
    case_name: "登录失败 - 空密码"
    description: "验证密码为空时系统能正确提示错误信息"
    severity: "critical"
    tags: ["login", "negative", "empty_validation", "password"]
    input_params:
      username: "13165"
      password: ""
    expected_results:
      error_message:
        text: "账户和密码不能为空！"
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "empty_validation"
      data_type: "invalid"
      empty_field: "password"
      expected_behavior: "inline_validation"

  - case_id: "LOGIN_004"
    case_name: "登录失败 - 用户名和密码均为空"
    description: "验证用户名和密码同时为空时的错误处理"
    severity: "critical"
    tags: ["login", "negative", "empty_validation"]
    input_params:
      username: ""
      password: ""
    expected_results:
      error_message:
        text: "账户和密码不能为空！"
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "empty_validation"
      data_type: "invalid"
      empty_field: "both"
      expected_behavior: "inline_validation"

  # ==================== 负向场景 - 错误凭证 ====================
  - case_id: "LOGIN_005"
    case_name: "登录失败 - 错误密码"
    description: "验证使用错误密码登录时系统拒绝访问并给出适当提示"
    severity: "critical"
    tags: ["login", "negative", "wrong_credentials", "password"]
    input_params:
      username: "13165"
      password: "wrong_password_123"
    expected_results:
      error_message:
        text: ["密码错误", "用户名或密码错误", "认证失败"]  # 支持多种可能的错误文本
      login_success: false
      status_code: 401
      window_remains: "LoginDialog"  # 登录窗口应保持打开
    boundary_conditions:
      category: "wrong_credentials"
      data_type: "invalid"
      invalid_field: "password"
      security_check: "no_account_lockout"  # 单次失败不应锁定账户

  - case_id: "LOGIN_006"
    case_name: "登录失败 - 错误用户名"
    description: "验证使用不存在的用户名登录时系统拒绝访问"
    severity: "critical"
    tags: ["login", "negative", "wrong_credentials", "username"]
    input_params:
      username: "nonexistent_user"
      password: "1"
    expected_results:
      error_message:
        text: ["用户名不存在", "用户名或密码错误", "认证失败"]
      login_success: false
      status_code: 401
      window_remains: "LoginDialog"
    boundary_conditions:
      category: "wrong_credentials"
      data_type: "invalid"
      invalid_field: "username"
      security_check: "generic_error_message"  # 不应明确提示"用户名不存在"

  - case_id: "LOGIN_007"
    case_name: "登录失败 - 用户名和密码均错误"
    description: "验证用户名和密码同时错误时的安全响应"
    severity: "high"
    tags: ["login", "negative", "wrong_credentials"]
    input_params:
      username: "wrong_user"
      password: "wrong_password"
    expected_results:
      error_message:
        text: "用户名或密码错误"  # 安全考虑，不应区分是用户名还是密码错误
      login_success: false
      status_code: 401
      window_remains: "LoginDialog"
    boundary_conditions:
      category: "wrong_credentials"
      data_type: "invalid"
      invalid_field: "both"
      security_check: "ambiguous_error_message"

  # ==================== 边界值测试 ====================
  - case_id: "LOGIN_008"
    case_name: "边界测试 - 最短用户名"
    description: "验证系统接受最短允许长度的用户名"
    severity: "medium"
    tags: ["login", "boundary", "positive"]
    input_params:
      username: "1"  # 假设最小长度为1
      password: "1"
    expected_results:
      login_success: true
      status_code: 200
    boundary_conditions:
      category: "boundary_value"
      boundary_type: "min"
      field: "username"
      limit_value: 1

  - case_id: "LOGIN_009"
    case_name: "边界测试 - 最长用户名"
    description: "验证系统处理最大长度用户名的能力"
    severity: "medium"
    tags: ["login", "boundary", "negative"]
    input_params:
      username: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # 50个a
      password: "1"
    expected_results:
      error_message:
        text: ["用户名长度超限", "输入无效"]
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "boundary_value"
      boundary_type: "max_exceeded"
      field: "username"
      limit_value: 50

  # ==================== 安全测试 ====================
  - case_id: "LOGIN_010"
    case_name: "安全测试 - SQL注入尝试"
    description: "验证系统能防御SQL注入攻击"
    severity: "critical"
    tags: ["login", "security", "sql_injection", "negative"]
    input_params:
      username: "admin' OR '1'='1"
      password: "password"
    expected_results:
      error_message:
        text: ["用户名或密码错误", "非法输入"]
      login_success: false
      status_code: 401
      window_remains: "LoginDialog"
    boundary_conditions:
      category: "security_test"
      test_type: "sql_injection"
      expected_behavior: "sanitize_input"

  - case_id: "LOGIN_011"
    case_name: "安全测试 - XSS尝试"
    description: "验证系统能防御跨站脚本攻击"
    severity: "critical"
    tags: ["login", "security", "xss", "negative"]
    input_params:
      username: "<script>alert('xss')</script>"
      password: "password"
    expected_results:
      error_message:
        text: ["用户名或密码错误", "非法字符"]
      login_success: false
      status_code: 400
      # 验证脚本未被原样输出
      script_not_executed: true
    boundary_conditions:
      category: "security_test"
      test_type: "xss"
      expected_behavior: "escape_special_chars"

  - case_id: "LOGIN_012"
    case_name: "安全测试 - 账户锁定机制"
    description: "验证连续失败登录后账户锁定功能"
    severity: "high"
    tags: ["login", "security", "account_lockout", "negative"]
    input_params:
      username: "13165"
      password: "wrong_password"
      attempts: 5  # 假设5次失败后锁定
    expected_results:
      after_attempts:
        error_message:
          text: ["账户已锁定", "尝试次数过多"]
        login_success: false
        status_code: 403
        account_locked: true
    boundary_conditions:
      category: "security_test"
      test_type: "account_lockout"
      lockout_threshold: 5
      expected_behavior: "temporary_lock"

  # ==================== 兼容性测试 ====================
  - case_id: "LOGIN_013"
    case_name: "兼容性测试 - 特殊字符用户名"
    description: "验证系统处理包含特殊字符的用户名"
    severity: "medium"
    tags: ["login", "compatibility", "special_chars", "negative"]
    input_params:
      username: "user@123#test"
      password: "1"
    expected_results:
      error_message:
        text: ["用户名或密码错误", "非法字符"]
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "compatibility"
      test_type: "special_characters"
      allowed_chars: "alphanumeric_only"

  # ==================== ComboBox功能测试 ====================
  - case_id: "LOGIN_014"
    case_name: "ComboBox功能 - 用户名下拉选择"
    description: "验证从ComboBox下拉列表选择已有用户名时，能自动填充到输入框"
    severity: "medium"
    tags: ["login", "combobox", "positive", "ui_interaction"]
    input_params:
      username: "75145"  # 从控件树中已知的ListItem
      password: "1"
    expected_results:
      login_success: true
      status_code: 200
    boundary_conditions:
      category: "combobox_function"
      data_type: "valid"
      test_type: "dropdown_selection"

  - case_id: "LOGIN_015"
    case_name: "ComboBox功能 - 用户名输入建议"
    description: "验证输入部分用户名时，能显示匹配的用户名列表"
    severity: "medium"
    tags: ["login", "combobox", "positive", "ui_interaction"]
    input_params:
      username: "75"  # 输入部分用户名
      password: "1"
      expected_dropdown: true
    expected_results:
      dropdown_visible: true
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "combobox_function"
      data_type: "partial"
      test_type: "input_suggestion"

  - case_id: "LOGIN_016"
    case_name: "ComboBox功能 - 无效用户名选择"
    description: "验证选择无效用户名登录时，系统能正确处理"
    severity: "medium"
    tags: ["login", "combobox", "negative", "ui_interaction"]
    input_params:
      username: "invalid_user"  # 无效用户名
      password: "1"
    expected_results:
      error_message:
        text: ["用户名不存在", "用户名或密码错误", "认证失败"]
      login_success: false
      status_code: 401
    boundary_conditions:
      category: "combobox_function"
      data_type: "invalid"
      test_type: "invalid_selection"

  # ==================== 记住密码功能测试 ====================
  - case_id: "LOGIN_017"
    case_name: "记住密码功能 - 记住密码验证"
    description: "验证勾选记住密码后，成功登录并退出，重新打开应用时能自动填充用户名和密码"
    severity: "medium"
    tags: ["login", "remember_password", "positive", "persistence"]
    input_params:
      username: "13165"
      password: "1"
      remember_password: true
    expected_results:
      login_success: true
      status_code: 200
      credentials_saved: true
    boundary_conditions:
      category: "remember_password_function"
      data_type: "valid"
      test_type: "remember_credentials"

  - case_id: "LOGIN_018"
    case_name: "记住密码功能 - 取消记住密码"
    description: "验证先勾选记住密码，再取消勾选后，成功登录并退出，下次打开应用时不会自动填充密码"
    severity: "medium"
    tags: ["login", "remember_password", "positive", "persistence"]
    input_params:
      username: "13165"
      password: "1"
      remember_password: false
    expected_results:
      login_success: true
      status_code: 200
      credentials_saved: false
    boundary_conditions:
      category: "remember_password_function"
      data_type: "valid"
      test_type: "cancel_remember_credentials"

  # ==================== 辅助功能按钮测试 ====================
  - case_id: "LOGIN_019"
    case_name: "辅助功能 - 找回密码按钮点击"
    description: "验证点击'找回密码'按钮时，能打开找回密码页面或弹窗"
    severity: "medium"
    tags: ["login", "auxiliary_buttons", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      forgot_password_window: true
      status_code: 200
    boundary_conditions:
      category: "auxiliary_button_function"
      test_type: "forgot_password_button"

  - case_id: "LOGIN_020"
    case_name: "辅助功能 - 在线注册按钮点击"
    description: "验证点击'在线注册'按钮时，能打开注册页面或弹窗"
    severity: "medium"
    tags: ["login", "auxiliary_buttons", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      register_window: true
      status_code: 200
    boundary_conditions:
      category: "auxiliary_button_function"
      test_type: "register_button"

  - case_id: "LOGIN_021"
    case_name: "辅助功能 - 找回密码页面返回"
    description: "验证点击找回密码按钮打开页面后，能成功返回登录页面"
    severity: "medium"
    tags: ["login", "auxiliary_buttons", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      return_to_login: true
      status_code: 200
    boundary_conditions:
      category: "auxiliary_button_function"
      test_type: "navigation_flow"

  - case_id: "LOGIN_022"
    case_name: "辅助功能 - 注册页面返回"
    description: "验证点击在线注册按钮打开页面后，能成功返回登录页面"
    severity: "medium"
    tags: ["login", "auxiliary_buttons", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      return_to_login: true
      status_code: 200
    boundary_conditions:
      category: "auxiliary_button_function"
      test_type: "navigation_flow"

  # ==================== 密码输入框功能测试 ====================
  - case_id: "LOGIN_023"
    case_name: "密码功能 - 密码显示切换"
    description: "验证点击密码输入框的显示/隐藏按钮时，密码能在明文和密文之间切换"
    severity: "medium"
    tags: ["login", "password_function", "ui_interaction", "positive"]
    input_params:
      username: "13165"
      password: "1"
    expected_results:
      password_visibility_toggle: true
      status_code: 200
    boundary_conditions:
      category: "password_function"
      test_type: "visibility_toggle"

  - case_id: "LOGIN_024"
    case_name: "密码功能 - 密码复制粘贴"
    description: "验证密码输入框的复制粘贴功能是否正常工作"
    severity: "medium"
    tags: ["login", "password_function", "ui_interaction", "positive"]
    input_params:
      username: "13165"
      password: "1"
      test_copy_paste: true
    expected_results:
      copy_paste_functionality: true
      status_code: 200
    boundary_conditions:
      category: "password_function"
      test_type: "copy_paste"

  - case_id: "LOGIN_025"
    case_name: "密码功能 - 密码长度限制"
    description: "验证密码输入框能正确处理超过最大长度的密码"
    severity: "medium"
    tags: ["login", "password_function", "boundary", "negative"]
    input_params:
      username: "13165"
      password: "password12345678901234567890"  # 超过最大长度的密码
    expected_results:
      password_truncated: true
      login_success: false
      status_code: 400
    boundary_conditions:
      category: "password_function"
      boundary_type: "max_exceeded"
      field: "password"
      limit_value: 20

  # ==================== 窗口控制功能测试 ====================
  - case_id: "LOGIN_026"
    case_name: "窗口功能 - 窗口最小化"
    description: "验证点击窗口最小化按钮时，窗口能正确最小化到任务栏"
    severity: "medium"
    tags: ["login", "window_function", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      window_minimized: true
      status_code: 200
    boundary_conditions:
      category: "window_function"
      test_type: "minimize"

  - case_id: "LOGIN_027"
    case_name: "窗口功能 - 窗口最大化还原"
    description: "验证点击窗口最大化和还原按钮时，窗口能在最大化和还原状态间切换"
    severity: "medium"
    tags: ["login", "window_function", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      window_maximized_restored: true
      status_code: 200
    boundary_conditions:
      category: "window_function"
      test_type: "maximize_restore"

  - case_id: "LOGIN_028"
    case_name: "窗口功能 - 窗口关闭"
    description: "验证点击窗口关闭按钮时，应用能正常关闭"
    severity: "medium"
    tags: ["login", "window_function", "ui_interaction", "positive"]
    input_params:
      username: "13165"
    expected_results:
      window_closed: true
      status_code: 200
    boundary_conditions:
      category: "window_function"
      test_type: "close"

  # ==================== UI交互与控件状态测试 ====================
  - case_id: "LOGIN_029"
    case_name: "UI交互 - 控件状态验证"
    description: "验证初始状态下各控件的启用/禁用状态是否符合预期"
    severity: "medium"
    tags: ["login", "ui_state", "positive", "validation"]
    input_params:
      username: ""
      password: ""
    expected_results:
      controls_initial_state: true
      status_code: 200
    boundary_conditions:
      category: "ui_state"
      test_type: "initial_state"

  - case_id: "LOGIN_030"
    case_name: "UI交互 - 输入触发状态变化"
    description: "验证输入内容过程中，相关控件状态能正确变化"
    severity: "medium"
    tags: ["login", "ui_state", "positive", "interaction"]
    input_params:
      username: "13165"
      password: "1"
    expected_results:
      controls_state_change: true
      status_code: 200
    boundary_conditions:
      category: "ui_state"
      test_type: "input_triggered"

  - case_id: "LOGIN_031"
    case_name: "UI交互 - 错误状态下的UI反馈"
    description: "验证输入错误凭证后，UI能给出正确的反馈"
    severity: "medium"
    tags: ["login", "ui_state", "negative", "feedback"]
    input_params:
      username: "invalid_user"
      password: "wrong_password"
    expected_results:
      error_ui_feedback: true
      login_success: false
      status_code: 401
    boundary_conditions:
      category: "ui_state"
      test_type: "error_feedback"

  - case_id: "LOGIN_032"
    case_name: "UI交互 - 焦点切换测试"
    description: "验证使用键盘Tab键时，焦点能按合理顺序在控件间切换"
    severity: "medium"
    tags: ["login", "ui_state", "positive", "keyboard_navigation"]
    input_params:
      username: ""
      password: ""
    expected_results:
      focus_order_correct: true
      status_code: 200
    boundary_conditions:
      category: "ui_state"
      test_type: "focus_navigation"

# 测试步骤模板 - 用于生成测试用例的步骤
# 可以根据需要扩展不同的步骤模板
step_templates:
  # 标准登录流程模板
  login_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.username_field.best_match}}"
      save_as: "account_edit"
    
    - action: "clear_text"
      params:
        ctrl: "$account_edit"
    
    - action: "input_text"
      params:
        ctrl: "$account_edit"
        text: "{{input_params.username}}"
        allure_attach: true
        allure_name: "输入用户名_{{case_id}}"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.password_field.best_match}}"
      save_as: "password_edit"
    
    - action: "clear_text"
      params:
        ctrl: "$password_edit"
    
    - action: "input_text"
      params:
        ctrl: "$password_edit"
        text: "{{input_params.password}}"
        allure_attach: true
        allure_name: "输入密码_{{case_id}}"

    # 记住密码复选框处理
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.remember_password_checkbox}}"
      save_as: "remember_password_chk"
      optional: true

    - action: "check_ctrl"
      params:
        ctrl: "$remember_password_chk"
        checked: "{{input_params.remember_password}}"
      optional: true

    - action: "screenshot"
      params:
        target: "$login_win"
        filename: "reports/login_before_{{case_id}}.png"
        allure_attach: true
        allure_name: "登录前状态_{{case_id}}"

    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.login_button_text}}"
      save_as: "login_btn"
    
    - action: "click_ctrl"
      params:
        ctrl: "$login_btn"
        allure_attach: true
        allure_name: "执行登录操作_{{case_id}}"
      
    # 根据用例类型执行不同的验证步骤
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # ComboBox功能测试模板
  combobox_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "ComboBox"
      save_as: "username_combobox"
    
    - action: "click_ctrl"
      params:
        ctrl: "$username_combobox"
        allure_attach: true
        allure_name: "点击用户名下拉框_{{case_id}}"
    
    - action: "select_item"
      params:
        ctrl: "$username_combobox"
        item: "{{input_params.username}}"
        allure_attach: true
        allure_name: "选择下拉列表项_{{case_id}}"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.password_field.best_match}}"
      save_as: "password_edit"
    
    - action: "input_text"
      params:
        ctrl: "$password_edit"
        text: "{{input_params.password}}"
        allure_attach: true
        allure_name: "输入密码_{{case_id}}"
    
    - action: "click_ctrl"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.login_button_text}}"
      allure_attach: true
      allure_name: "执行登录操作_{{case_id}}"
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 辅助功能按钮测试模板
  auxiliary_buttons_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    # 测试找回密码按钮
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.find_password_button}}"
      save_as: "find_pwd_btn"
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$find_pwd_btn"
        allure_attach: true
        allure_name: "点击找回密码按钮_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 2
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
      optional: true
    
    # 测试在线注册按钮
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.register_button}}"
      save_as: "register_btn"
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$register_btn"
        allure_attach: true
        allure_name: "点击在线注册按钮_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 2
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 密码功能测试模板
  password_function_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.username_field.best_match}}"
      save_as: "account_edit"
    
    - action: "input_text"
      params:
        ctrl: "$account_edit"
        text: "{{input_params.username}}"
        allure_attach: true
        allure_name: "输入用户名_{{case_id}}"
    
    - action: "by_index"
      params:
        parent: "$login_win"
        best_match: "{{base_config.common.password_field.best_match}}"
      save_as: "password_edit"
    
    - action: "input_text"
      params:
        ctrl: "$password_edit"
        text: "{{input_params.password}}"
        allure_attach: true
        allure_name: "输入密码_{{case_id}}"
    
    # 测试密码显示/隐藏切换
    - action: "by_index"
      params:
        parent: "$password_edit"
        best_match: "Button"
      save_as: "password_visibility_btn"
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$password_visibility_btn"
        allure_attach: true
        allure_name: "点击密码显示按钮_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 1
      optional: true
    
    - action: "click_ctrl"
      params:
        ctrl: "$password_visibility_btn"
        allure_attach: true
        allure_name: "点击密码隐藏按钮_{{case_id}}"
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # 窗口功能测试模板
  window_function_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    # 测试窗口最小化
    - action: "minimize_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "最小化窗口_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 1
      optional: true
    
    - action: "restore_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "还原窗口_{{case_id}}"
      optional: true
    
    # 测试窗口最大化
    - action: "maximize_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "最大化窗口_{{case_id}}"
      optional: true
    
    - action: "sleep"
      params:
        seconds: 1
      optional: true
    
    - action: "restore_window"
      params:
        ctrl: "$login_win"
        allure_attach: true
        allure_name: "还原窗口_{{case_id}}"
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"
  
  # UI状态测试模板
  ui_state_flow:
    - action: "start"
      params:
        exec_path: "{{base_config.common.exec_path}}"
        timeout: 10
        allure_attach: true
        allure_name: "打开登录窗口_{{case_id}}"
    
    - action: "get_window"
      params:
        class_name: "{{base_config.common.window_class}}"
        timeout: 5
      save_as: "login_win"
      on_failure: "attach_screenshot"
    
    # 验证初始控件状态
    - action: "check_ctrl_state"
      params:
        parent: "$login_win"
        controls: ["Edit", "Button"]
        allure_attach: true
        allure_name: "验证初始控件状态_{{case_id}}"
      optional: true
    
    # 测试焦点切换
    - action: "test_focus_order"
      params:
        parent: "$login_win"
        controls: ["{{base_config.common.username_field.best_match}}", "{{base_config.common.password_field.best_match}}", "{{base_config.common.login_button_text}}"]
        allure_attach: true
        allure_name: "测试焦点切换_{{case_id}}"
      optional: true
    
    - action: "validate_result"
      params:
        expected: "{{expected_results}}"
        case_type: "{{boundary_conditions.category}}"

  # 错误消息验证专用模板
  error_validation_flow:
    - action: "get_window"
      params:
        class_name: "QMessageBox"
      timeout: 5
      save_as: "msg_box"
      optional: true  # 某些错误可能在页面上直接显示
    
    - action: "by_index"
      params:
        parent: "$msg_box"
        best_match: "QLabel"
      save_as: "msg_label"
    
    - action: "get_text"
      params:
        ctrl: "$msg_label"
      save_as: "actual_error"
    
    - action: "assert"
      params:
        condition: "actual_error in expected_results.error_message.text"
        on_failure: "log_error_and_screenshot"

# 验证规则配置
validation_rules:
  retry_mechanism:
    enabled: true
    max_retries: 2
    retry_delay: 1  # 秒
    
  timeout_config:
    element_wait: 5
    page_load: 10
    script_timeout: 30
    
  screenshot_policy:
    on_failure: true
    on_assertion: true
    path_template: "reports/screenshots/{{case_id}}_{{timestamp}}.png"